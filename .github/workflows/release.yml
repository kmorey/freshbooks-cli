name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Verify tag matches package version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Build release assets
        run: |
          mkdir dist
          npm pack --pack-destination dist
          set -- dist/*.tgz
          test "$#" -eq 1
          mv "$1" dist/freshbooks-cli.tar.gz
          cd dist
          sha256sum freshbooks-cli.tar.gz > freshbooks-cli.tar.gz.sha256
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/freshbooks-cli.tar.gz
          dist/freshbooks-cli.tar.gz.sha256
          --verify-tag
          --generate-notes
          --title "$GITHUB_REF_NAME"
